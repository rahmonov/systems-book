// 2. CAP partition
WIDGETS.cap = function(root){
  root.innerHTML = labShell('Partition switch','A and B stay connected; C is cut off when partitioned.',
   '<label>Mode <select id="p-mode"><option value="CP">CP — refuse if no majority</option><option value="AP">AP — always answer</option></select></label>'+
   '<button id="p-traffic">Start traffic</button><button class="warn" id="p-part">Partition C</button><button class="secondary" id="p-reset">Reset</button>',
   '<svg viewBox="0 0 560 150" id="p-svg"></svg><div class="stats"><div class="stat"><b id="p-ok">0</b><span>answered</span></div><div class="stat"><b id="p-ref" style="color:var(--ink-3)">0</b><span>refused</span></div><div class="stat"><b id="p-stale" style="color:var(--warn)">0</b><span>stale reads</span></div><div class="stat"><b id="p-conf" style="color:var(--bad)">0</b><span>conflicting writes</span></div></div>');
  root._t0=performance.now(); const log=mkLog(root);
  const names=['A','B','C'], X=[100,280,460];
  let rep, ver, partitioned, traffic, st, minorityWrites, inflight;
  function reset(){ rep=[{val:'v0',ver:0},{val:'v0',ver:0},{val:'v0',ver:0}]; ver=0; partitioned=false; traffic=false; st={ok:0,ref:0,stale:0,conf:0}; minorityWrites=0; inflight=[]; root.querySelector('#p-traffic').textContent='Start traffic'; root.querySelector('#p-part').textContent='Partition C'; root.querySelector('#p-part').className='warn'; root.querySelector('.log').innerHTML=''; root._t0=performance.now(); draw(); }
  const mode=()=>root.querySelector('#p-mode').value;
  const canReach=(i,j)=> !partitioned || (i<2 && j<2) || i===j;
  const inMajority=(i)=> !partitioned || i<2;
  function op(){ const i=Math.floor(Math.random()*3); const isWrite=Math.random()<0.4; const now=performance.now();
    if(mode()==='CP' && !inMajority(i)){ st.ref++; log('t',(isWrite?'write':'read')+' at C refused: cannot reach a majority'); return; }
    if(isWrite){ if(!inMajority(i)){ minorityWrites++; rep[i]={val:'c'+(minorityWrites),ver:rep[i].ver+1}; st.ok++; log('warn','write '+rep[i].val+' accepted at C (minority side)'); }
      else { ver++; const val='v'+ver; rep[i]={val,ver}; st.ok++; log('info','write '+val+' at '+names[i]); names.forEach((n,j)=>{ if(j!==i) inflight.push({to:j,val,ver,arrive:now+300+Math.random()*200,from:i}); }); } }
    else { const newest=ver; const r=rep[i]; st.ok++; if(r.ver<newest && inMajority(i)===false || (r.val.startsWith('v') && r.ver<newest)){ st.stale++; log('warn','read '+names[i]+' → '+r.val+' — stale (newest is v'+newest+')'); } else if(r.val.startsWith('c')){ st.stale++; log('warn','read C → '+r.val+' — value nobody else will ever see'); } else log('ok','read '+names[i]+' → '+r.val); } }
  root.querySelector('#p-traffic').onclick=e=>{ traffic=!traffic; e.target.textContent=traffic?'Stop traffic':'Start traffic'; };
  root.querySelector('#p-part').onclick=e=>{ partitioned=!partitioned; if(partitioned){ minorityWrites=0; e.target.textContent='Heal partition'; e.target.className='bad'; log('bad','partition: C can no longer reach A or B'); } else { e.target.textContent='Partition C'; e.target.className='warn'; if(minorityWrites>0){ st.conf+=minorityWrites; log('bad','healed: C accepted '+minorityWrites+' write(s) that conflict with the majority; discarding them (last-writer-wins by majority)'); } else log('ok','healed: no conflicts'); rep[2]={val:'v'+ver,ver}; } };
  root.querySelector('#p-reset').onclick=reset;
  function tick(){ const now=performance.now(); if(traffic && Math.random()<0.35) op(); inflight=inflight.filter(m=>{ if(!canReach(m.from,m.to)) return true; if(now>=m.arrive){ if(m.ver>rep[m.to].ver) rep[m.to]={val:m.val,ver:m.ver}; return false;} return true; }); draw(); }
  function draw(){ let s=''; s+='<line x1="145" y1="75" x2="235" y2="75" stroke="#14213D" stroke-width="2"/>'; s+='<line x1="325" y1="75" x2="415" y2="75" stroke="'+(partitioned?'#B3261E':'#14213D')+'" stroke-width="2" '+(partitioned?'stroke-dasharray="6 5"':'')+'/>'; if(partitioned) s+='<text x="345" y="65" class="lbl" fill="#B3261E">✂ cut</text>';
    names.forEach((n,i)=>{ const cls='node'+(partitioned&&i===2?' partitioned':''); s+='<rect x="'+(X[i]-45)+'" y="40" width="90" height="70" rx="6" class="'+cls+'"/><text x="'+(X[i]-38)+'" y="60" class="lbl">'+n+(i<2?' (majority)':'')+'</text><text x="'+(X[i]-38)+'" y="90" class="val">'+rep[i].val+'</text>'; });
    root.querySelector('#p-svg').innerHTML=s; root.querySelector('#p-ok').textContent=st.ok; root.querySelector('#p-ref').textContent=st.ref; root.querySelector('#p-stale').textContent=st.stale; root.querySelector('#p-conf').textContent=st.conf; }
  reset(); root._timer=setInterval(tick,120);
};

// 3. Replication + failover
WIDGETS.replication = function(root){
  root.innerHTML = labShell('Leader, two followers, one crash','Hold "Write" to stream writes. Then crash the leader.',
   '<label>Mode <select id="r-mode"><option value="async">asynchronous</option><option value="semi">semi-synchronous (wait for 1 follower)</option></select></label>'+
   '<label>Follower lag <input type="range" id="r-lag" min="100" max="3000" step="100" value="1500"> <span id="r-lv">1.5s</span></label>'+
   '<button id="r-w">Write (hold)</button><button class="bad" id="r-crash">Crash leader</button><button class="secondary" id="r-reset">Reset</button>',
   '<svg viewBox="0 0 560 200" id="r-svg"></svg><div class="stats"><div class="stat"><b id="r-ack">0</b><span>acknowledged</span></div><div class="stat"><b id="r-f1">0</b><span>on follower 1</span></div><div class="stat"><b id="r-f2">0</b><span>on follower 2</span></div><div class="stat"><b id="r-lost" style="color:var(--bad)">—</b><span>lost at failover</span></div></div>');
  root._t0=performance.now(); const log=mkLog(root);
  let leaderIdx, nodes, acked, pendingAcks, inflight, holding, lost, lastW;
  function reset(){ nodes=[{name:'leader',applied:0,alive:true},{name:'follower 1',applied:0,alive:true},{name:'follower 2',applied:0,alive:true}]; leaderIdx=0; acked=0; pendingAcks=[]; inflight=[]; holding=false; lost=null; lastW=0; root.querySelector('#r-crash').disabled=false; root.querySelector('.log').innerHTML=''; root._t0=performance.now(); draw(); }
  root.querySelector('#r-lag').oninput=e=>root.querySelector('#r-lv').textContent=(e.target.value/1000).toFixed(1)+'s';
  const lag=()=>+root.querySelector('#r-lag').value;
  const wb=root.querySelector('#r-w'); wb.onpointerdown=()=>{holding=true;}; wb.onpointerup=wb.onpointerleave=()=>{holding=false;}; wb.onclick=()=>write();
  function write(){ if(!nodes[leaderIdx].alive) return; const L=nodes[leaderIdx]; L.applied++; const idx=L.applied; const now=performance.now();
    nodes.forEach((n,j)=>{ if(j!==leaderIdx && n.alive) inflight.push({to:j,idx,arrive:now+lag()*(0.8+Math.random()*0.4)}); });
    if(root.querySelector('#r-mode').value==='async'){ acked++; } else { pendingAcks.push(idx); } }
  root.querySelector('#r-crash').onclick=e=>{ const L=nodes[leaderIdx]; L.alive=false; e.target.disabled=true; inflight=inflight.filter(m=>m.to!==leaderIdx); pendingAcks=[]; let best=-1,bi=-1; nodes.forEach((n,j)=>{ if(n.alive && n.applied>best){best=n.applied;bi=j;} }); lost=Math.max(0,acked-best); log('bad','leader crashed with '+L.applied+' entries; '+acked+' had been acknowledged'); log(lost>0?'bad':'ok','promoted '+nodes[bi].name+' (has '+best+' entries) — '+lost+' acknowledged write(s) lost'); leaderIdx=bi; nodes[bi].name+=' → new leader'; };
  root.querySelector('#r-reset').onclick=reset;
  function tick(){ const now=performance.now(); if(holding && now-lastW>90){ write(); lastW=now; }
    inflight=inflight.filter(m=>{ if(now>=m.arrive){ const n=nodes[m.to]; if(n.alive && m.idx>n.applied) n.applied=m.idx; while(pendingAcks.length && nodes.some((x,j)=>j!==leaderIdx&&x.alive&&x.applied>=pendingAcks[0])){ pendingAcks.shift(); acked++; } return false; } return true; }); draw(); }
  function draw(){ const Y=[40,100,160]; let s=''; nodes.forEach((n,i)=>{ const isL=i===leaderIdx&&n.alive; s+='<text x="10" y="'+(Y[i]+5)+'" class="lbl">'+n.name+'</text><rect x="130" y="'+(Y[i]-12)+'" width="400" height="24" rx="4" fill="#F1F3F7" stroke="#CBD3DF"/>'; const w=Math.min(400,n.applied*4); s+='<rect x="130" y="'+(Y[i]-12)+'" width="'+w+'" height="24" rx="4" fill="'+(n.alive?(isL?'#1F4FD8':'#6B7793'):'#D9D9D9')+'"/><text x="'+(135+w)+'" y="'+(Y[i]+5)+'" class="val">'+n.applied+(n.alive?'':' ✝')+'</text>'; });
    const now=performance.now(); inflight.forEach(m=>{ const y=Y[m.to]-20; s+='<circle cx="'+(130+Math.min(400,m.idx*4))+'" cy="'+y+'" r="4" class="msg"/>'; });
    root.querySelector('#r-svg').innerHTML=s; root.querySelector('#r-ack').textContent=acked; root.querySelector('#r-f1').textContent=nodes[1].applied; root.querySelector('#r-f2').textContent=nodes[2].applied; root.querySelector('#r-lost').textContent=lost==null?'—':lost; }
  reset(); root._timer=setInterval(tick,60);
};
// 4. Quorum explorer
WIDGETS.quorum = function(root){
  root.innerHTML = labShell('Quorum explorer','Each round: write to W live replicas, kill/recover nodes, read from R.',
   '<label>N <input type="range" id="q-n" min="3" max="7" value="5"> <span id="q-nv">5</span></label>'+
   '<label>W <input type="range" id="q-w" min="1" max="7" value="3"> <span id="q-wv">3</span></label>'+
   '<label>R <input type="range" id="q-r" min="1" max="7" value="3"> <span id="q-rv">3</span></label>'+
   '<label>Failure rate <input type="range" id="q-f" min="0" max="50" value="15"> <span id="q-fv">15%</span></label>'+
   '<label><input type="checkbox" id="q-hh" checked> hinted handoff</label><label><input type="checkbox" id="q-rr"> read repair</label>'+
   '<button id="q-one">Run one round</button><button class="secondary" id="q-auto">Auto</button><button class="secondary" id="q-reset">Reset</button>',
   '<svg viewBox="0 0 560 130" id="q-svg"></svg><div id="q-overlap" style="font-weight:600;margin:6px 0"></div><div class="stats"><div class="stat"><b id="q-wok">0</b><span>writes ok</span></div><div class="stat"><b id="q-wf" style="color:var(--ink-3)">0</b><span>writes failed</span></div><div class="stat"><b id="q-rok">0</b><span>reads fresh</span></div><div class="stat"><b id="q-rs" style="color:var(--warn)">0</b><span>reads stale</span></div><div class="stat"><b id="q-rf" style="color:var(--ink-3)">0</b><span>reads failed</span></div></div>');
  root._t0=performance.now(); const log=mkLog(root);
  let rep, newest, st, auto=false;
  const g=id=>root.querySelector('#'+id); const val=id=>+g(id).value;
  ['n','w','r','f'].forEach(k=>{ g('q-'+k).oninput=()=>{ g('q-'+k+'v').textContent=g('q-'+k).value+(k==='f'?'%':''); if(k==='n') resize(); draw(); }; });
  function resize(){ const n=val('q-n'); g('q-w').max=n; g('q-r').max=n; if(val('q-w')>n) g('q-w').value=n; if(val('q-r')>n) g('q-r').value=n; g('q-wv').textContent=g('q-w').value; g('q-rv').textContent=g('q-r').value; while(rep.length<n) rep.push({alive:true,ver:0,hint:0}); rep.length=n; }
  function reset(){ rep=[]; newest=0; st={wok:0,wf:0,rok:0,rs:0,rf:0}; resize(); root.querySelector('.log').innerHTML=''; root._t0=performance.now(); draw(); }
  function pick(k){ const live=rep.map((r,i)=>r.alive?i:-1).filter(i=>i>=0); for(let i=live.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [live[i],live[j]]=[live[j],live[i]]; } return live.slice(0,k); }
  function round(){ const N=val('q-n'),W=val('q-w'),R=val('q-r'),F=val('q-f')/100;
    // write
    const ws=pick(W); if(ws.length<W){ st.wf++; log('t','write failed: only '+ws.length+' live replicas, need W='+W); } else { newest++; ws.forEach(i=>rep[i].ver=newest); st.wok++; if(g('q-hh').checked){ rep.forEach((r,i)=>{ if(!r.alive) r.hint=newest; }); } log('info','write ver '+newest+' → replicas '+ws.map(i=>i+1).join(',')); }
    // churn
    rep.forEach((r,i)=>{ if(r.alive){ if(Math.random()<F){ r.alive=false; log('warn','replica '+(i+1)+' died'); } } else if(Math.random()<0.5){ r.alive=true; if(r.hint>r.ver){ r.ver=r.hint; log('ok','replica '+(i+1)+' recovered and received hinted ver '+r.hint); } else log('t','replica '+(i+1)+' recovered'); r.hint=0; } });
    // read
    const rs=pick(R); if(rs.length<R){ st.rf++; log('t','read failed: only '+rs.length+' live replicas, need R='+R); } else { const mx=Math.max(...rs.map(i=>rep[i].ver)); if(mx>=newest){ st.rok++; log('ok','read from '+rs.map(i=>i+1).join(',')+' → ver '+mx+' (fresh)'); } else { st.rs++; log('warn','read from '+rs.map(i=>i+1).join(',')+' → ver '+mx+' — STALE (newest '+newest+')'); } if(g('q-rr').checked) rs.forEach(i=>{ if(rep[i].ver<mx) rep[i].ver=mx; }); }
    draw(); }
  g('q-one').onclick=round; g('q-auto').onclick=e=>{ auto=!auto; e.target.textContent=auto?'Stop':'Auto'; }; g('q-reset').onclick=reset;
  function draw(){ const N=rep.length; let s=''; const gap=560/(N+1); rep.forEach((r,i)=>{ const x=gap*(i+1); s+='<circle cx="'+x+'" cy="55" r="24" class="node'+(r.alive?'':' dead')+'"/><text x="'+(x-5)+'" y="50" class="lbl">'+(i+1)+'</text><text x="'+(x-10)+'" y="68" class="val">v'+r.ver+'</text>'+(r.hint>r.ver?'<text x="'+(x-18)+'" y="100" class="lbl" fill="#C77700">hint v'+r.hint+'</text>':''); });
    g('q-svg').innerHTML=s; const W=val('q-w'),R=val('q-r'); const ok=W+R>N; g('q-overlap').innerHTML='R + W = '+(R+W)+(ok?' > ':' ≤ ')+N+' → '+(ok?'<span style="color:var(--ok)">overlap guaranteed</span>':'<span style="color:var(--warn)">no overlap guarantee</span>'); ['wok','wf','rok','rs','rf'].forEach(k=>g('q-'+k).textContent=st[k]); }
  reset(); root._timer=setInterval(()=>{ if(auto) round(); },700);
};

// 5. CRDT playground
WIDGETS.crdt = function(root){
  root.innerHTML = labShell('Two replicas, two CRDTs','Edit both sides independently, then merge. Try to lose an update.',
   '<button id="d-merge">Merge replicas</button><button class="secondary" id="d-reset">Reset</button>',
   '<div id="d-stage" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>', true);
  let A,B;
  function fresh(id){ return {id, P:{A:0,B:0}, N:{A:0,B:0}, set:{}, removed:{}, tagSeq:0}; }
  function counterVal(r){ return r.P.A+r.P.B-r.N.A-r.N.B; }
  function setVal(r){ const out={}; for(const tag in r.set){ if(!r.removed[tag]) out[r.set[tag]]=true; } return Object.keys(out).sort(); }
  function merge(x,y){ const m=fresh(x.id); ['A','B'].forEach(k=>{ m.P[k]=Math.max(x.P[k],y.P[k]); m.N[k]=Math.max(x.N[k],y.N[k]); }); Object.assign(m.set,x.set,y.set); Object.assign(m.removed,x.removed,y.removed); m.tagSeq=Math.max(x.tagSeq,y.tagSeq); return m; }
  function render(){ const stage=root.querySelector('#d-stage'); stage.innerHTML=''; [A,B].forEach(r=>{ const box=h('div',{style:'background:#F3F5F9;border-radius:6px;padding:12px'}); box.innerHTML='<div style="font-weight:600;margin-bottom:8px">Replica '+r.id+'</div>'+
      '<div><b style="font-size:22px">'+counterVal(r)+'</b> <span style="color:var(--ink-3)">PN-Counter</span> <button data-r="'+r.id+'" data-a="inc" class="secondary">+1</button> <button data-r="'+r.id+'" data-a="dec" class="secondary">−1</button></div>'+
      '<div style="font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 12px">P={A:'+r.P.A+', B:'+r.P.B+'}  N={A:'+r.N.A+', B:'+r.N.B+'}</div>'+
      '<div><b>{ '+setVal(r).map(S).join(', ')+' }</b> <span style="color:var(--ink-3)">OR-Set</span></div>'+
      '<div style="margin:6px 0"><input id="d-in-'+r.id+'" placeholder="element" style="width:100px;padding:5px;border:1px solid var(--line);border-radius:4px"> <button data-r="'+r.id+'" data-a="add" class="secondary">add</button> <button data-r="'+r.id+'" data-a="rem" class="secondary">remove</button></div>'+
      '<div style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">tags: '+Object.entries(r.set).map(([t,e])=>(r.removed[t]?'<s>':'')+S(e)+'#'+t+(r.removed[t]?'</s>':'')).join(' ')+'</div>';
    stage.appendChild(box); });
    stage.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const r=b.dataset.r==='A'?A:B; const a=b.dataset.a; if(a==='inc') r.P[r.id]++; if(a==='dec') r.N[r.id]++; if(a==='add'||a==='rem'){ const el=root.querySelector('#d-in-'+r.id).value.trim(); if(!el) return; if(a==='add'){ r.tagSeq++; r.set[r.id+r.tagSeq]=el; } else { for(const t in r.set) if(r.set[t]===el) r.removed[t]=true; } } render(); }); }
  root.querySelector('#d-merge').onclick=()=>{ const m=merge(A,B); A=Object.assign(fresh('A'),m,{id:'A'}); B=Object.assign(fresh('B'),m,{id:'B'}); render(); };
  root.querySelector('#d-reset').onclick=()=>{ A=fresh('A'); B=fresh('B'); render(); };
  A=fresh('A'); B=fresh('B'); render();
};

// 6. Raft
WIDGETS.raft = function(root){
  root.innerHTML = labShell('Raft cluster of five','Randomized timeouts, heartbeats, a log. Pre-Vote is off on purpose.',
   '<label>Speed <input type="range" id="f-speed" min="1" max="10" value="4"></label>'+
   '<button id="f-write">Client write</button><button class="bad" id="f-crash">Crash leader</button><button class="secondary" id="f-revive">Revive all</button>'+
   '<label>Node <select id="f-node"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button class="warn" id="f-part">Partition</button><button class="secondary" id="f-heal">Heal</button><button class="secondary" id="f-reset">Reset</button>',
   '<svg viewBox="0 0 560 250" id="f-svg"></svg>');
  root._t0=performance.now(); const log=mkLog(root);
  const N=5, HB=100, ET=[300,600], NET=[40,90];
  let nodes, msgs, now, cmdSeq;
  function mk(i){ return {id:i,state:'follower',term:0,votedFor:null,log:[],commit:0,alive:true,part:false,timeout:0,votes:0,next:[],match:[],hb:0}; }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function resetTimer(n){ n.timeout=now+rnd(ET[0],ET[1]); }
  function reset(){ now=0; cmdSeq=0; msgs=[]; nodes=[]; for(let i=0;i<N;i++){ const n=mk(i); nodes.push(n); resetTimer(n); } root.querySelector('.log').innerHTML=''; root._t0=performance.now(); draw(); }
  function send(from,to,m){ if(!nodes[from].alive||!nodes[to].alive||nodes[from].part||nodes[to].part) return; msgs.push(Object.assign({from,to,at:now+rnd(NET[0],NET[1])},m)); }
  const majority=Math.floor(N/2)+1;
  function becomeFollower(n,term){ if(n.state==='leader') log('warn','node '+(n.id+1)+' steps down (saw term '+term+')'); n.state='follower'; n.term=term; n.votedFor=null; resetTimer(n); }
  function startElection(n){ n.state='candidate'; n.term++; n.votedFor=n.id; n.votes=1; resetTimer(n); log('info','node '+(n.id+1)+' times out → candidate for term '+n.term); const li=n.log.length, lt=li?n.log[li-1].term:0; for(let j=0;j<N;j++) if(j!==n.id) send(n.id,j,{type:'RV',term:n.term,li,lt}); }
  function becomeLeader(n){ n.state='leader'; n.next=Array(N).fill(n.log.length+1); n.match=Array(N).fill(0); n.hb=0; log('ok','node '+(n.id+1)+' elected leader for term '+n.term+' ('+n.votes+' votes)'); heartbeat(n); }
  function heartbeat(L){ L.hb=now+HB; for(let j=0;j<N;j++){ if(j===L.id) continue; const pi=L.next[j]-1; const pt=pi>0?L.log[pi-1].term:0; const entries=L.log.slice(pi); send(L.id,j,{type:'AE',term:L.term,pi,pt,entries,lc:L.commit}); } }
  function handle(m){ const n=nodes[m.to]; if(!n.alive) return;
    if(m.term>n.term) becomeFollower(n,m.term);
    if(m.type==='RV'){ const li=n.log.length, lt=li?n.log[li-1].term:0; const upToDate=m.lt>lt||(m.lt===lt&&m.li>=li); const grant=m.term===n.term&&(n.votedFor===null||n.votedFor===m.from)&&upToDate; if(grant){ n.votedFor=m.from; resetTimer(n); } send(n.id,m.from,{type:'RVR',term:n.term,grant}); }
    else if(m.type==='RVR'){ if(n.state==='candidate'&&m.term===n.term&&m.grant){ n.votes++; if(n.votes>=majority) becomeLeader(n); } }
    else if(m.type==='AE'){ if(m.term<n.term){ send(n.id,m.from,{type:'AER',term:n.term,ok:false,mi:0}); return; } if(n.state!=='follower') n.state='follower'; resetTimer(n); const ok=m.pi===0||(n.log.length>=m.pi&&n.log[m.pi-1].term===m.pt); if(ok){ n.log=n.log.slice(0,m.pi).concat(m.entries); if(m.lc>n.commit){ const old=n.commit; n.commit=Math.min(m.lc,n.log.length); if(n.commit>old) log('t','node '+(n.id+1)+' commit index → '+n.commit); } } send(n.id,m.from,{type:'AER',term:n.term,ok,mi:ok?m.pi+m.entries.length:0,pi:m.pi}); }
    else if(m.type==='AER'){ if(n.state!=='leader'||m.term!==n.term) return; if(m.ok){ n.match[m.from]=Math.max(n.match[m.from],m.mi); n.next[m.from]=m.mi+1; for(let idx=n.log.length;idx>n.commit;idx--){ if(n.log[idx-1].term!==n.term) continue; const cnt=1+n.match.filter((x,j)=>j!==n.id&&x>=idx).length; if(cnt>=majority){ n.commit=idx; log('ok','leader committed entry '+idx+' ('+n.log[idx-1].cmd+') on '+cnt+' nodes'); break; } } } else { n.next[m.from]=Math.max(1,n.next[m.from]-1); } } }
  function step(){ now+=10; msgs.sort((a,b)=>a.at-b.at); while(msgs.length&&msgs[0].at<=now){ const m=msgs.shift(); if(!nodes[m.to].part&&!nodes[m.from].part) handle(m); } nodes.forEach(n=>{ if(!n.alive) return; if(n.state==='leader'){ if(now>=n.hb) heartbeat(n); } else if(now>=n.timeout) startElection(n); }); }
  function leader(){ return nodes.find(n=>n.alive&&n.state==='leader'&&!n.part); }
  root.querySelector('#f-write').onclick=()=>{ const L=leader(); if(!L){ log('warn','no reachable leader; write rejected'); return; } cmdSeq++; L.log.push({term:L.term,cmd:'set x='+cmdSeq}); log('info','client → leader '+(L.id+1)+': set x='+cmdSeq+' appended at index '+L.log.length); heartbeat(L); };
  root.querySelector('#f-crash').onclick=()=>{ const L=nodes.find(n=>n.alive&&n.state==='leader'); if(!L){ log('t','no live leader to crash'); return; } L.alive=false; log('bad','node '+(L.id+1)+' (leader, term '+L.term+') crashed'); };
  root.querySelector('#f-revive').onclick=()=>{ nodes.forEach(n=>{ if(!n.alive){ n.alive=true; n.state='follower'; resetTimer(n); log('ok','node '+(n.id+1)+' revived as follower (term '+n.term+')'); } }); };
  root.querySelector('#f-part').onclick=()=>{ const n=nodes[+root.querySelector('#f-node').value-1]; n.part=true; log('bad','node '+(n.id+1)+' partitioned from the cluster'); };
  root.querySelector('#f-heal').onclick=()=>{ const n=nodes[+root.querySelector('#f-node').value-1]; if(n.part){ n.part=false; log('warn','node '+(n.id+1)+' reconnected with term '+n.term+' — watch for disruption'); } };
  root.querySelector('#f-reset').onclick=reset;
  function draw(){ let s=''; const cx=[80,190,300,410,520]; nodes.forEach((n,i)=>{ const cls='node '+(n.alive?(n.state==='leader'?'leader':n.state==='candidate'?'candidate':''):'dead')+(n.part?' partitioned':''); s+='<circle cx="'+cx[i]+'" cy="50" r="30" class="'+cls+'"/><text x="'+(cx[i]-6)+'" y="46" class="val">'+(i+1)+'</text><text x="'+(cx[i]-22)+'" y="64" class="lbl">t'+n.term+' '+(n.alive?n.state.slice(0,4):'dead')+'</text>';
      // log bars
      n.log.forEach((e,k)=>{ const x=cx[i]-45+k*9; if(k>9) return; const committed=k<n.commit; s+='<rect x="'+x+'" y="'+(95+(e.term%4)*0)+'" width="8" height="'+(committed?26:16)+'" fill="'+(committed?'#1F4FD8':'#B9C4DB')+'"><title>index '+(k+1)+' term '+e.term+' '+e.cmd+'</title></rect>'; });
      s+='<text x="'+(cx[i]-45)+'" y="140" class="lbl">log '+n.log.length+' · commit '+n.commit+'</text>';
      if(n.alive&&n.state!=='leader'){ const frac=Math.max(0,Math.min(1,(n.timeout-now)/ET[1])); s+='<rect x="'+(cx[i]-45)+'" y="150" width="90" height="4" fill="#E3E8EF"/><rect x="'+(cx[i]-45)+'" y="150" width="'+(90*frac)+'" height="4" fill="#C77700"/>'; } });
    msgs.forEach(m=>{ const p=1-Math.max(0,(m.at-now))/NET[1]; const x=cx[m.from]+(cx[m.to]-cx[m.from])*p; const y=190+Math.sin(p*Math.PI)*25*(m.to>m.from?1:-1); s+='<circle cx="'+x+'" cy="'+y+'" r="4" class="msg'+(m.type==='RV'||m.type==='RVR'?' stale':'')+'"><title>'+m.type+' term '+m.term+'</title></circle>'; });
    s+='<text x="10" y="245" class="lbl">sim time '+(now/1000).toFixed(1)+'s · blue = AppendEntries · amber = votes · bar = election timer</text>'; root.querySelector('#f-svg').innerHTML=s; }
  reset(); root._timer=setInterval(()=>{ const sp=+root.querySelector('#f-speed').value; for(let k=0;k<sp;k++) step(); draw(); },50);
};
// ---------- App ----------
const ORDER = Object.keys(CH).sort((a,b)=>CH[a].n-CH[b].n);
const done = new Set(); // in-memory only; resets on reload
let currentTimer=null;

function partTitle(p){ return (PARTS.find(x=>x[0]===p)||[p,'Part '+p])[1]; }
function renderTOC(){ const toc=document.getElementById('toc'); toc.innerHTML=''; PARTS.forEach(([p,title])=>{ const ids=ORDER.filter(id=>CH[id].part===p); const d=h('details',{open: p===3?'':null}); if(p!==3) d.removeAttribute('open'); d.innerHTML='<summary><span>Part '+(p-2)+' · '+title+'</span><span class="count">'+ids.length+'</span></summary><ol>'+ids.map(id=>'<li><a href="#'+id+'" data-id="'+id+'" class="'+(CH[id].stub?'stub':'')+'"><span class="n">'+CH[id].n+'</span><span>'+CH[id].title+'</span></a></li>').join('')+'</ol>'; toc.appendChild(d); }); }
function chipList(ids){ return ids.length? ids.map(id=>'<a href="#'+id+'">'+CH[id].n+' · '+CH[id].title+'</a>').join(''):'<span style="color:var(--ink-3)">none — this is a starting point</span>'; }
function render(id){ const c=CH[id]; if(!c) return render(ORDER[0]); if(currentTimer){ clearInterval(currentTimer); currentTimer=null; }
  const main=document.getElementById('main'); const idx=ORDER.indexOf(id); const prev=ORDER[idx-1], next=ORDER[idx+1];
  const usedBy=ORDER.filter(x=>CH[x].on.includes(id));
  let body='';
  if(c.stub){ body='<div class="stub-note">This chapter is scaffolded: objectives and outline are final, the first-principles text and simulator are the next release. It builds directly on the chapters listed above; read those first.</div><div class="prose"><h3>Session outline (2 hours)</h3><ol>'+c.outline.map(o=>'<li>'+o+'</li>').join('')+'</ol></div>'; }
  else { body='<div class="prose">'+c.html+'</div><div id="widget"></div>'+(c.hw?'<div class="homework"><h4>Homework</h4><ol style="margin:0;padding-left:20px">'+c.hw.map(x=>'<li>'+x+'</li>').join('')+'</ol></div>':''); }
  main.innerHTML='<div class="crumb">Part '+(c.part-2)+' · '+partTitle(c.part)+'</div><h2 class="title">'+c.n+'. '+c.title+'</h2>'+
    '<div class="meta"><div><b>Builds on</b><div class="chips">'+chipList(c.on)+'</div></div>'+(usedBy.length?'<div><b>Used by</b><div class="chips">'+chipList(usedBy)+'</div></div>':'')+'</div>'+
    '<div class="objectives"><h4>By the end of this chapter you can</h4><ul>'+c.obj.map(o=>'<li>'+o+'</li>').join('')+'</ul></div>'+body+
    '<div class="pager">'+(prev?'<a href="#'+prev+'"><small>Previous</small>'+CH[prev].n+'. '+CH[prev].title+'</a>':'<span></span>')+(next?'<a href="#'+next+'" style="text-align:right"><small>Next</small>'+CH[next].n+'. '+CH[next].title+'</a>':'')+'</div>';
  if(!c.stub && c.widget && WIDGETS[c.widget]){ const w=document.getElementById('widget'); WIDGETS[c.widget](w); currentTimer=w._timer||null; }
  done.add(id); document.querySelectorAll('.rail a[data-id]').forEach(a=>{ a.classList.toggle('active',a.dataset.id===id); a.classList.toggle('done',done.has(a.dataset.id)); if(a.dataset.id===id){ const d=a.closest('details'); if(d) d.open=true; } });
  document.getElementById('progressBar').style.width=(100*done.size/ORDER.length).toFixed(1)+'%';
  window.scrollTo(0,0); document.getElementById('rail').classList.remove('open'); }
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('rail').classList.toggle('open');
renderTOC(); render(location.hash.slice(1)||ORDER[0]);
</script>
